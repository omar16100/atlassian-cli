[workspace]
members = [
    "crates/cli",
    "crates/api",
    "crates/auth",
    "crates/config",
    "crates/output",
    "crates/bulk",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
authors = ["atlassian-cli contributors"]
license = "MIT"
repository = "https://github.com/omar16100/atlassian-cli"
homepage = "https://atlassiancli.com"

[workspace.dependencies]
# CLI
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
tokio = { version = "1.51", features = ["full"] }

# HTTP & Serialization
reqwest = { version = "0.13", features = ["json", "multipart", "stream", "native-tls-vendored"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Output formatting
# default-features disabled to drop the `derive` feature (tabled_derive ->
# proc-macro-error2, which is unmaintained per RUSTSEC-2026-0173). We only use
# tabled's Builder + Style, not #[derive(Tabled)].
tabled = { version = "0.21", default-features = false, features = ["std"] }
colored = "3.1"
indicatif = "0.18"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Auth & Config
base64 = "0.22"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
dirs = "6.0"
futures = "0.3"
backoff = { version = "0.4", features = ["tokio"] }
async-trait = "0.1"
async-stream = "0.3"
htmd = "0.5"
# Markdown -> ADF conversion for Jira descriptions/comments
pulldown-cmark = { version = "0.13", default-features = false }

# Testing
wiremock = "0.6"
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }
proptest = "1.11"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# cargo-release configuration
[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
tag-message = "Release {{version}}"
pre-release-commit-message = "chore: bump version to {{version}}"
