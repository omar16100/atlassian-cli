[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Unmaintained crates - transitive dependencies, monitoring for replacements
ignore = [
    "RUSTSEC-2025-0012",  # backoff is unmaintained (used by api crate)
    "RUSTSEC-2024-0384",  # instant is unmaintained (dependency of backoff)
    "RUSTSEC-2025-0119",  # number_prefix unmaintained (dependency of indicatif)
    "RUSTSEC-2024-0370",  # proc-macro-error unmaintained (dependency of tabled)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "MPL-2.0",      # colored crate
    "Unicode-3.0",  # ICU crates (internationalization)
]

[bans]
multiple-versions = "warn"
