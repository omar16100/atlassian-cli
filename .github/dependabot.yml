version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      production:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # release.yml is generated by cargo-dist; upgrade via cargo-dist-version bump.
      # The `plan` job runs `dist plan`, which byte-verifies the committed workflow
      # against what dist would generate, so any hand-edit to it fails CI. Dependabot
      # cannot scope an ignore to a single file, so these are blocked repo-wide.
      - dependency-name: "actions/upload-artifact"
      - dependency-name: "actions/download-artifact"
      # Major only. ci.yml, security.yml and publish-crates.yml are hand-maintained and
      # already on checkout@v7, while the generated release.yml is on v4, so a major bump
      # can only ever satisfy one of them. It broke CI twice: #12 (reverted by 43a57e7)
      # and again in #89. Patch and minor still flow. Re-check the three hand-maintained
      # workflows whenever cargo-dist-version moves.
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
