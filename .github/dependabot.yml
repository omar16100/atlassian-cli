version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      production:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # release.yml is generated by cargo-dist; upgrade via cargo-dist-version bump.
      - dependency-name: "actions/upload-artifact"
      - dependency-name: "actions/download-artifact"
